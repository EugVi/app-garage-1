    <path d="M 150 52 L 165 52 Q 185 52 196 60 L 196 70 L 150 70 Z" fill="#1e3a5f" opacity="0.7"/>
    <!-- Wheels -->
    <circle cx="65" cy="130" r="22" fill="#0a0a0a" stroke="#22c55e" stroke-width="2"/>
    <circle cx="65" cy="130" r="14" fill="#1a1a1a"/>
    <circle cx="65" cy="130" r="6" fill="#22c55e" opacity="0.3"/>
    <circle cx="227" cy="130" r="22" fill="#0a0a0a" stroke="#22c55e" stroke-width="2"/>
    <circle cx="227" cy="130" r="14" fill="#1a1a1a"/>
    <circle cx="227" cy="130" r="6" fill="#22c55e" opacity="0.3"/>
    <!-- Headlight -->
    <circle cx="260" cy="88" r="6" fill="#fef9c3" opacity="0.9"/>
